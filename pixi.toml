[workspace]
name = "qm-anderson"
version = "0.1.0"
description = "3D Anderson localization: quantum percolation thresholds via TMM + FSS"
authors = ["Petya"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
numpy = ">=2.0"
scipy = ">=1.13"
matplotlib = ">=3.9"
h5py = ">=3.11"
networkx = ">=3.3"
tqdm = ">=4.66"
pytest = ">=8.2"
# JAX with CUDA 12 via conda-forge (includes jaxlib-cuda wheels)
jax = ">=0.9.0"
jaxlib = ">=0.9.0"

[tasks]
# Validation: MUST reproduce W_c≈16.5, ν≈1.571 before proceeding
benchmark    = { cmd = "python runs/sc_benchmark.py",                       description = "Full SC Anderson benchmark (TMM + FSS)" }
refit        = { cmd = "python runs/sc_benchmark.py --refit",               description = "Refit FSS on existing sc_benchmark.h5 — no TMM rerun" }
sc-dilution  = { cmd = "python runs/sc_dilution.py",                        description = "Measure p_q for SC site-diluted lattice" }
bcc-dilution = { cmd = "python runs/bcc_dilution.py",                       description = "BCC site dilution. Do not run until SC is calibrated." }
analyse      = { cmd = "python analysis/fss_analysis.py",                   description = "FSS summary table: SC benchmark + SC + BCC percolation" }
figures      = { cmd = "python analysis/figures.py",                        description = "Generate all publication figures" }
test         = { cmd = "pytest tests/ -v -s --tb=short -m 'not slow'",      description = "Fast tests only — skips slow GPU integration tests (<60s)" }
test-all     = { cmd = "pytest tests/ -v -s --tb=short",                    description = "Full test suite including slow GPU integration tests (~21 min)" }
