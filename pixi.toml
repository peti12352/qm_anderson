[project]
name = "qm-anderson"
version = "0.1.0"
description = "3D Anderson localization: quantum percolation thresholds via TMM + FSS"
authors = ["Petya"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<2"
scipy = ">=1.13"
matplotlib = ">=3.9"
h5py = ">=3.11"
networkx = ">=3.3"
tqdm = ">=4.66"
pytest = ">=8.2"
# JAX with CUDA 12 via conda-forge (includes jaxlib-cuda wheels)
jax = ">=0.9.0"
jaxlib = ">=0.9.0"

[tasks]
# Validation: MUST reproduce W_c≈16.5, ν≈1.571 before proceeding
benchmark   = { cmd = "python runs/sc_benchmark.py",  description = "Reproduce ν=1.571 for 3D SC Anderson disorder (gate for all other runs)" }
sc-dilution = { cmd = "python runs/sc_dilution.py",   description = "Measure p_q for SC site-diluted lattice" }
bcc-dilution= { cmd = "python runs/bcc_dilution.py",  description = "Measure p_q for BCC site-diluted lattice" }
figures     = { cmd = "python analysis/figures.py",   description = "Generate all publication figures" }
test        = { cmd = "pytest tests/ -v --tb=short",  description = "Run test suite" }
